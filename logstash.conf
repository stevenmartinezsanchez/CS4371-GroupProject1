input {
  kafka {
    bootstrap_servers => "localhost:9092"
    topics => ["entities-counts"]
    group_id => "logstash-entities"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  if [entity] =~ /^.{100,}/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "entity-counts"
    document_id => "%{entity}"
  }
}
